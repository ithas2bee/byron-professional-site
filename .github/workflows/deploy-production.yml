name: Deploy Personal Website PRODUCTION

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to PRODUCTION Ubuntu Server
    runs-on: self-hosted

    steps:
      - name: Check out latest code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static website
        run: npm run build

      - name: Build Docker image
        run: docker build -t byron-professional-site:production .

      - name: Replace production container
        run: |
          docker rm -f byron-professional-site-production || true
          docker run -d \
            --name byron-professional-site-production \
            --restart unless-stopped \
            -p 8087:80 \
            byron-professional-site:production

      - name: Verify deployment
        run: |
          for attempt in $(seq 1 10); do
            if curl --fail --silent http://localhost:8087/ > /dev/null; then
              echo "Production website is responding successfully."
              exit 0
            fi
            sleep 2
          done
          echo "Production website did not respond successfully."
          docker logs byron-professional-site-production
          exit 1
